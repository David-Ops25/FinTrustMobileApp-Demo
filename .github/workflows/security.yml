name: FinTrust Security Pipeline

on:
  push:
    branches: [main, feature/docker-security]
  pull_request:
    branches: [main]

jobs:
  appsec-and-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: npm audit (HIGH+)
        run: npm audit --audit-level=high

      - name: Build Docker image
        run: docker build -t fintrust-app:ci .

      - name: Trivy scan (fail HIGH/CRITICAL)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.65.0
          image
          --scanners vuln
          --vuln-type library
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          fintrust-app:ci
